[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscopelive"
version = "0.2.0"
description = "Shared-acquisition Python desktop and web oscilloscope"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "PyQt6>=6.8,<7",
    "pyqtgraph>=0.13.7,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
pyscopelive = "pyscopelive.desktop:main"
pyscopelive-server = "pyscopelive.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyscopelive = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
